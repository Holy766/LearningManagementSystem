
name: LMS Build and Tests

on:
  push:
    branches: [main, feature/phase-6-quality-assurance, feature/phase-8-class-extensions]
  pull_request:
    branches: [main]

jobs:
  build-and-test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y cmake g++ libsqlite3-dev libargon2-dev libgtest-dev

      - name: Configure project
        run: cmake -S . -B build

      - name: Build project
        run: cmake --build build

      - name: Run tests
        run: ctest --test-dir build --output-on-failure
        
      - name: Install Cppcheck
        run: sudo apt-get install -y cppcheck

      - name: Run static analysis
        run: cppcheck --enable=warning,style,performance,portability --error-exitcode=1 -I include src
        
